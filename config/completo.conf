# Política 3: completa. La stop más tesauro, nombres de varias palabras y raíces de Porter.
# Formato de archivo de configuración de Linux (estilo INI, como /etc/*.conf):
# secciones entre corchetes, "clave = valor", comentarios con # o ;.
# Las rutas relativas se resuelven desde la raíz del repo.

[coleccion]
# Carpeta donde quedó el texto que bajó la araña y la base de metadatos.
raiz = repository
base = repository/crawl.db

[normalizacion]
plegado = config/plegado.txt
minusculas = si
fechas = si
numeros = si
stopwords = config/stopwords.txt
tesauro = config/tesauro.txt
nombres = config/nombres.txt
stemming = porter
largo_min = 1
largo_max = 40

[indice]
nombre = completo
salida = indices/completo.idx
# 0 = un proceso por núcleo.
procesos = 0
docs_por_bloque = 20000
temporal = indices/tmp

[lucene]
salida = indices/lucene-completo
hilos = 0
ram_mb = 512
fusionar = si
